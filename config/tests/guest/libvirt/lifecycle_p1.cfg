        only remove_guest.without_disk
    # virsh sendkey testcases require guestxml with usb keyboard for the qemu to
    # emulate keystokes
    - virsh_sendkey:
        variants:
            - guest_import:
                display = 'graphic'
                vga="standard"
                only unattended_install.import.import.default_install.aio_native
            - sendkey:
                only virsh.sendkey
            - guest_remove:
                only remove_guest.without_disk
